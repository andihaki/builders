name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Builders. Do not include secrets, private data, or security vulnerabilities here; use the private security reporting link instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this bug already reported.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
      placeholder: I expected ... but instead ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence, repository revision, and any non-sensitive sample data needed.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, Node.js version, and whether Supabase is configured when relevant.
      placeholder: Safari 20, macOS, Node.js 22.13, seed mode
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove access tokens, personal data, and other secrets before pasting anything.
      render: shell
