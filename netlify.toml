[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Runs the Next.js server on Netlify. Required now that the site renders per
# request: every page reads the visitor's session or the database.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# talents.builders.swegrowth.id is an alias of this site that exists only to point
# people at the directory. A full URL in `from` matches the host the browser
# asked for, so the rule fires for that name alone, and `force` is what makes it
# win over the catch-all the Next.js plugin adds — without it the whole app
# would answer under the subdomain. Both schemes are listed because a full-URL
# `from` matches only the scheme it names, and plain http is what arrives in the
# window before Netlify has issued a certificate for the alias.
[[redirects]]
  from = "https://talents.builders.swegrowth.id/*"
  to = "https://builders.swegrowth.id/people"
  status = 301
  force = true

[[redirects]]
  from = "http://talents.builders.swegrowth.id/*"
  to = "https://builders.swegrowth.id/people"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
